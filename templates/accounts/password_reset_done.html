{% extends 'base.html' %}

{% block title %}Email Sent - StartKH{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-5 text-center">
                <i class="fa-solid fa-paper-plane text-success fs-1 mb-3"></i>
                <h3 class="fw-bold mb-2">Instructions Sent</h3>
                <p class="text-muted text-xs">An email has been sent with instructions to reset your password. Please check your inbox (and spam folder).</p>
                <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4 mt-3">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
