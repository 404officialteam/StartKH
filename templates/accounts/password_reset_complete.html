{% extends 'base.html' %}

{% block title %}Password Reset Complete - StartKH{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-5 text-center">
                <i class="fa-solid fa-circle-check text-success fs-1 mb-3"></i>
                <h3 class="fw-bold mb-2">Password Reset Successful</h3>
                <p class="text-muted text-xs">Your password has been reset successfully. You can now use your new password to log in.</p>
                <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4 mt-3">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
