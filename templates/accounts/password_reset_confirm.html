{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Confirm Password Reset - StartKH{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">Enter New Password</h3>
                    <p class="text-muted text-xs">Please enter and confirm your new password below.</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
